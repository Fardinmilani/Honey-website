name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.14-alpine3.23
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7.4.10-alpine3.21
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      REDIS_URL: redis://127.0.0.1:6379
      TOTP_ENCRYPTION_KEY_BASE64: AwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwM=
      MEDIA_MINIO_TESTS: 'true'
      S3_INTERNAL_ENDPOINT: http://127.0.0.1:9000
      S3_BROWSER_ENDPOINT: http://127.0.0.1:9000
      S3_REGION: local
      S3_ACCESS_KEY: honey-ci-minio
      S3_SECRET_KEY: honey-ci-deterministic-password
      S3_PUBLIC_BUCKET: honey-media-ci
      S3_PRIVATE_BUCKET: honey-private-ci
      PUBLIC_MEDIA_BASE_URL: http://127.0.0.1:9000/honey-media-ci/

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.20.0 --activate
          pnpm --version

      - name: Locate pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start pinned isolated MinIO
        run: |
          docker run --detach --name honey-ci-minio \
            --publish 127.0.0.1:9000:9000 \
            --env MINIO_ROOT_USER=honey-ci-minio \
            --env MINIO_ROOT_PASSWORD=honey-ci-deterministic-password \
            --health-cmd 'curl -f http://localhost:9000/minio/health/live' \
            --health-interval 2s --health-timeout 2s --health-retries 30 \
            minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
          for attempt in {1..30}; do
            [ "$(docker inspect --format='{{.State.Health.Status}}' honey-ci-minio)" = healthy ] && exit 0
            sleep 2
          done
          docker logs honey-ci-minio
          exit 1

      - name: Initialize isolated MinIO test buckets
        run: >-
          docker run --rm --network host --entrypoint /bin/sh
          minio/mc:RELEASE.2025-08-13T08-35-41Z -c
          'mc alias set ci http://127.0.0.1:9000 honey-ci-minio honey-ci-deterministic-password >/dev/null &&
          mc mb --ignore-existing ci/honey-media-ci ci/honey-private-ci &&
          mc anonymous set download ci/honey-media-ci &&
          mc anonymous set none ci/honey-private-ci'

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Check architecture boundaries
        run: pnpm boundaries

      - name: Type-check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Run Phase 7 media and MinIO integration tests
        run: >-
          pnpm --filter @honey/backend test -- --run
          test/media.test.ts
          test/media.integration.test.ts
          test/storage.fake.contract.test.ts
          test/storage.minio.contract.test.ts

      - name: Build
        run: pnpm build

      - name: Verify Phase 4 database foundation
        run: pnpm phase4:verify

      - name: Generate and verify OpenAPI contract
        run: pnpm api:openapi:generate && pnpm api:openapi:check

      - name: Lint and scan OpenAPI contract
        run: pnpm api:openapi:lint && pnpm api:openapi:forbidden

      - name: Check pull-request OpenAPI compatibility
        if: github.event_name == 'pull_request'
        run: pnpm api:openapi:breaking --base-ref origin/${{ github.base_ref }}

      - name: Verify Phase 5 API foundation
        run: pnpm phase5:verify

      - name: Verify Phase 6 identity and authorization
        run: pnpm phase6:verify

      - name: Verify Phase 7 media and storage
        run: pnpm phase7:verify

      - name: Build API container
        run: pnpm api:docker:build
