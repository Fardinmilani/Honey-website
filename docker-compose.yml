name: honey-local

services:
  postgres:
    image: postgres:16.14-alpine3.23
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-honey_local}
      POSTGRES_USER: ${POSTGRES_USER:-honey_local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-replace-with-local-development-password}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/local/postgres/init-extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - honey-internal

  redis:
    image: redis:7.4.10-alpine3.21
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--appendfsync', 'everysec']
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks:
      - honey-internal

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-honey-local-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-replace-with-local-development-password}
      # MinIO supports server-level CORS. Keep this an explicit local origin;
      # deployed environments provide their own validated HTTPS origin list.
      MINIO_API_CORS_ALLOW_ORIGIN: ${MEDIA_UPLOAD_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - '127.0.0.1:${MINIO_PORT:-9000}:9000'
      - '127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - honey-internal

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    restart: 'no'
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-honey-local-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-replace-with-local-development-password}
      MINIO_PUBLIC_BUCKET: ${MINIO_PUBLIC_BUCKET:-honey-media}
      MINIO_PRIVATE_BUCKET: ${MINIO_PRIVATE_BUCKET:-honey-private}
    entrypoint: ['/bin/sh', '/init-buckets.sh']
    volumes:
      - ./docker/local/minio/init-buckets.sh:/init-buckets.sh:ro
    networks:
      - honey-internal

  mailpit:
    image: axllent/mailpit:v1.30.6
    restart: unless-stopped
    environment:
      MP_DATABASE: /data/mailpit.db
    ports:
      - '127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025'
      - '127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025'
    volumes:
      - mailpit-data:/data
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks:
      - honey-internal

volumes:
  postgres-data:
    name: honey-local-postgres-data
  redis-data:
    name: honey-local-redis-data
  minio-data:
    name: honey-local-minio-data
  mailpit-data:
    name: honey-local-mailpit-data

networks:
  honey-internal:
    name: honey-local-internal
    driver: bridge
